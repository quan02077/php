<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
</head>

<body>
    <h2>Form Đăng Ký Tài Khoản</h2>

    <form id="registerForm" onsubmit="handleRegister(event)">
        <table>
            <tr>
                <td>Họ và tên:</td>
                <td><input type="text" id="fullname"></td>
            </tr>
            <tr>
                <td>Tên đăng nhập:</td>
                <td><input type="text" id="username"></td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="text" id="email"></td>
            </tr>
            <tr>
                <td>Mật khẩu:</td>
                <td><input type="password" id="password"></td>
            </tr>
            <tr>
                <td>Xác nhận mật khẩu:</td>
                <td><input type="password" id="confirm_password"></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <button type="submit">Đăng ký</button>
                    <button type="reset">Làm lại</button>
                </td>
            </tr>
        </table>
    </form>

    <div id="message" style="margin-top: 15px;"></div>

    <script>
        function handleRegister(event) {
            event.preventDefault();

            let fullname = document.getElementById('fullname').value.trim();
            let username = document.getElementById('username').value.trim();
            let email = document.getElementById('email').value.trim();
            let password = document.getElementById('password').value;
            let confirmPassword = document.getElementById('confirm_password').value;
            let messageBox = document.getElementById('message');

            if (fullname === '' || username === '' || email === '' || password === '' || confirmPassword === '') {
                messageBox.innerHTML = '<span style="color: red;">Vui lòng điền đầy đủ tất cả các trường!</span>';
                return;
            }

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                messageBox.innerHTML = '<span style="color: red;">Email không đúng định dạng!</span>';
                return;
            }

            if (password.length < 6) {
                messageBox.innerHTML = '<span style="color: red;">Mật khẩu phải có ít nhất 6 ký tự!</span>';
                return;
            }

            if (password !== confirmPassword) {
                messageBox.innerHTML = '<span style="color: red;">Mật khẩu xác nhận không khớp!</span>';
                return;
            }

            let formData = new FormData();
            formData.append('fullname', fullname);
            formData.append('username', username);
            formData.append('email', email);
            formData.append('password', password);

            fetch('register.php', {
                method: 'POST',
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        messageBox.innerHTML = `<span style="color: green;">${data.message}</span>`;
                        document.getElementById('registerForm').reset();
                    } else {
                        messageBox.innerHTML = `<span style="color: red;">${data.message}</span>`;
                    }
                })
                .catch(() => {
                    messageBox.innerHTML = '<span style="color: red;">Có lỗi xảy ra khi gửi dữ liệu!</span>';
                });
        }
    </script>
</body>

</html>
