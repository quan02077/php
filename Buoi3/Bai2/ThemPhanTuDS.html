<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="txt" placeholder="Nhap noi dung..."/>
    <button onclick="addList()">Them vao danh sach</button>
    <ul id="lists"></ul>

    <script>
        function addList(){
            let val = document.getElementById("txt").value;
            if(val.trim() !== ""){
                let li = document.createElement("li");
                li.innerText = val;
                document.getElementById("lists").appendChild(li);
            }
        }
    </script>
</body>
</html>
