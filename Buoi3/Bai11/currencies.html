<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Bảng Tỷ Giá Ngoại Tệ</h2>
    <p>Thời gian cập nhật lần cuối: <span id="lastUpdated"></span></p>

    <table border="1" id="rateTable">
        <thead>
            <tr>
                <th>Mã ngoại tệ</th>
                <th>Tên ngoại tệ</th>
                <th>Giá(VND)</th>
            </tr>
        </thead>
        <tbody id="rateBody"></tbody>
    </table>

    <script>
        // Danh sách các ngoại tệ phổ biến và tên tiếng Việt tương ứng
        const popularCurrencies = {
            "USD": "Đô la Mỹ",
            "EUR": "Euro",
            "GBP": "Bảng Anh",
            "JPY": "Yên Nhật",
            "SGD": "Đô la Singapore",
            "AUD": "Đô la Úc",
            "CAD": "Đô la Canada",
            "CNY": "Nhân dân tệ",
            "KRW": "Won Hàn Quốc",
            "THB": "Baht Thái",
            "CHF": "Franc Thụy Sĩ",
            "HKD": "Đô la Hồng Kông"
        };

        function getRate() {
            fetch('currency.php')
                .then(res => res.json())
                .then(data => {
                    if (!data || !data.rates) {
                        document.getElementById('rateBody').innerHTML = `<tr><td colspan="3">Không thể tải dữ liệu từ API.</td></tr>`;
                        return;
                    }

                    // 1. Cập nhật thời gian cập nhật lần cuối
                    document.getElementById('lastUpdated').innerText = data.date;

                    // 2. Lấy tỷ giá VND so với USD làm mốc
                    const vndRateComparedToUSD = parseFloat(data.rates["VND"]);

                    let html = '';

                    // 3. Duyệt qua danh sách các ngoại tệ cần hiển thị
                    for (const code in popularCurrencies) {
                        const currencyName = popularCurrencies[code];
                        const rateComparedToUSD = parseFloat(data.rates[code]);

                        if (rateComparedToUSD) {
                            let rateInVND;
                            
                            if (code === "USD") {
                                // 1 USD = vndRateComparedToUSD VND
                                rateInVND = vndRateComparedToUSD;
                            } else {
                                // Tính tỷ giá: 1 ngoại tệ = bao nhiêu VND
                                rateInVND = vndRateComparedToUSD / rateComparedToUSD;
                            }

                            // Định dạng hiển thị tiền tệ
                            const formattedRate = rateInVND.toLocaleString('vi-VN', {
                                minimumFractionDigits: 0,
                                maximumFractionDigits: 2
                            });

                            html += `<tr>
                                <td><strong>${code}</strong></td>
                                <td>${currencyName}</td>
                                <td>${formattedRate}</td>
                            </tr>`;
                        }
                    }
                    document.getElementById('rateBody').innerHTML = html;
                })
                .catch(err => {
                    console.error("Lỗi:", err);
                    document.getElementById('rateBody').innerHTML = `<tr><td colspan="3">Có lỗi xảy ra khi lấy dữ liệu!</td></tr>`;
                });
        }
        
        getRate();
        // Cập nhật lại mỗi 10 phút
        setInterval(getRate, 10 * 60 * 1000);
    </script>
</body>

</html>
